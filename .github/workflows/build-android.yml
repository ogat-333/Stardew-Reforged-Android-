name: Build Reforged Android launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      game_apk_url:
        description: "Direct Dropbox download URL for the verified Stardew Valley APK"
        required: true
        type: string
        default: "https://www.dropbox.com/scl/fi/aabkqi2ci7hx1penwbf7y/3013-stardew-valley-ru-1.6.15.3-Wildroid.ru.apk?rlkey=l4tuqr2jrncbt90z91u5l92jp&st=h1fqz7pi&dl=1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4

      - name: Checkout SMAPI Android source
        uses: actions/checkout@v4
        with:
          repository: NRTnarathip/SMAPI-Android-1.6
          ref: develop
          path: SMAPI-Android-1.6-temp

      - name: Apply Android Harmony startup compatibility patch
        run: |
          python3 tools/patch_android_smapi.py "$GITHUB_WORKSPACE/SMAPI-Android-1.6-temp"

      - name: Install .NET 9 and JDK 17
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.312

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Download and verify the user's exact game APK
        env:
          GAME_APK_URL: ${{ inputs.game_apk_url || secrets.GAME_APK_URL || 'https://www.dropbox.com/scl/fi/aabkqi2ci7hx1penwbf7y/3013-stardew-valley-ru-1.6.15.3-Wildroid.ru.apk?rlkey=l4tuqr2jrncbt90z91u5l92jp&st=h1fqz7pi&dl=1' }}
          GAME_APK_BEARER_TOKEN: ${{ secrets.GAME_APK_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GAME_APK_URL:-}" ]]; then
            echo "::error::Provide game_apk_url when starting the workflow or add GAME_APK_URL as a repository secret."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/reforged"
          if [[ -n "${GAME_APK_BEARER_TOKEN:-}" ]]; then
            curl --fail --location --retry 3 --silent --show-error \
              -H "Authorization: Bearer $GAME_APK_BEARER_TOKEN" \
              "$GAME_APK_URL" -o "$RUNNER_TEMP/reforged/game.apk"
          else
            curl --fail --location --retry 3 --silent --show-error \
              "$GAME_APK_URL" -o "$RUNNER_TEMP/reforged/game.apk"
          fi
          echo "Downloaded APK size: $(stat -c%s "$RUNNER_TEMP/reforged/game.apk") bytes"

      - name: Extract game assemblies without publishing them
        run: |
          python3 -m pip install --disable-pip-version-check lz4
          python3 tools/extract_game_dlls.py \
            "$RUNNER_TEMP/reforged/game.apk" \
            "$RUNNER_TEMP/reforged/game-dlls"
          mkdir -p "$GITHUB_WORKSPACE/SMAPI-Android-1.6-temp/src/DependenciesDll"
          cp "$RUNNER_TEMP/reforged/game-dlls/"*.dll \
            "$GITHUB_WORKSPACE/SMAPI-Android-1.6-temp/src/DependenciesDll/"

      - name: Prepare external SMAPI dependency path
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/SMAPI-Android-1.6-temp" \
            "$GITHUB_WORKSPACE/../SMAPI-Android-1.6"
          test -d "$GITHUB_WORKSPACE/SMAPI-Android-1.6-temp/src/DependenciesDll"
          test -f "$GITHUB_WORKSPACE/../SMAPI-Android-1.6/src/DependenciesDll/StardewValley.dll"

      - name: Build and package patched Android SMAPI ZIP
        env:
          SMAPI_ROOT: ${{ github.workspace }}/SMAPI-Android-1.6-temp
          SMAPI_PACKAGE_DIR: ${{ runner.temp }}/reforged/smapi-package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reforged/game" "$SMAPI_PACKAGE_DIR"

          dotnet build "$SMAPI_ROOT/src/SMAPI/SMAPI.csproj" \
            --configuration "Android Release" \
            -p:Platform=ARM64 \
            "-p:GamePath=$RUNNER_TEMP/reforged/game" \
            -p:CopyToGameFolder=false \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME_17_X64"

          export SMAPI_BIN="$SMAPI_ROOT/src/SMAPI/bin/ARM64/Android Release"
          test -s "$SMAPI_BIN/StardewModdingAPI.dll"

          python3 - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          repo = Path(os.environ["SMAPI_ROOT"])
          bin_dir = Path(os.environ["SMAPI_BIN"])
          out_dir = Path(os.environ["SMAPI_PACKAGE_DIR"])
          package_name = "SMAPI-Android-4.3.2.5-Reforged"
          stage = out_dir / package_name
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)

          dependencies = repo / "src/PackSMAPIZip/dependencies.txt"
          names = [
              line.strip()
              for line in dependencies.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          optional_android = {"System.CodeDom.dll", "System.Management.dll", "VdfConverter.dll"}
          missing = [name for name in names if not (bin_dir / name).is_file() and name not in optional_android]
          if missing:
              raise SystemExit("Missing required SMAPI package dependencies: " + ", ".join(missing))

          skipped = [name for name in names if not (bin_dir / name).is_file()]
          if skipped:
              print("Omitting platform-specific dependencies absent from Android build: " + ", ".join(skipped))

          for name in names:
              source = bin_dir / name
              if source.is_file():
                  shutil.copy2(source, stage / name)

          internal = stage / "smapi-internal"
          internal.mkdir()
          shutil.copytree(bin_dir / "i18n", internal / "i18n")
          for source, destination in (
              ("SMAPI.config.json", "config.json"),
              ("SMAPI.blacklist.json", "blacklist.json"),
              ("SMAPI.metadata.json", "metadata.json"),
          ):
              source_path = bin_dir / source
              if not source_path.is_file():
                  raise SystemExit(f"Missing SMAPI package file: {source_path}")
              shutil.copy2(source_path, internal / destination)

          zip_path = out_dir / f"{package_name}.zip"
          if zip_path.exists():
              zip_path.unlink()
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(out_dir))

          size = zip_path.stat().st_size
          if size > 10 * 1024 * 1024:
              raise SystemExit(f"Patched SMAPI ZIP exceeds the Android launcher's 10 MB limit: {size} bytes")
          with zipfile.ZipFile(zip_path) as archive:
              entries = archive.namelist()
              if not any(name.endswith("/StardewModdingAPI.dll") for name in entries):
                  raise SystemExit("Patched SMAPI ZIP is missing StardewModdingAPI.dll")
          print(f"Created {zip_path.name} ({size} bytes)")
          print(f"Package contents: {len(entries)} files")
          PY
      - name: Install custom Mono runtime
        run: |
          set -euo pipefail
          source_runtime="$GITHUB_WORKSPACE/SharedLibs/native/arm64-v8a/libmonosgen-2.0.so"
          test -s "$source_runtime"
          target_runtime="$(find "$DOTNET_ROOT/packs/Microsoft.NETCore.App.Runtime.Mono.android-arm64" \
            -path '*/runtimes/android-arm64/native/libmonosgen-2.0.so' -type f | head -n 1)"
          test -n "$target_runtime"
          cp "$source_runtime" "$target_runtime"

      - name: Build signed Android APK
        run: |
          dotnet build SMAPIGameLoader/SMAPIGameLoader.csproj \
            --configuration Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME_17_X64"

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Stardew-Reforged-Android-launcher
          path: SMAPIGameLoader/bin/Release/net9.0-android/abc.smapi.gameloader-Signed.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload patched SMAPI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Stardew-Reforged-Android-patched-SMAPI
          path: ${{ runner.temp }}/reforged/smapi-package/SMAPI-Android-4.3.2.5-Reforged.zip
          if-no-files-found: error
          retention-days: 7
